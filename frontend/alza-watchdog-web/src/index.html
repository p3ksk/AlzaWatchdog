<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Alza Watchdog</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Legacy first, SVG second: browsers that understand image/svg+xml prefer it
       and ignore the .ico, while older ones stop at the first link they know. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Tints the mobile browser chrome to match the page it is framing. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2e7d0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16110b">
</head>

</body>
</html>
