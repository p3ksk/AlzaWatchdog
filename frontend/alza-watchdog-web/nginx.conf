server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Bookmarked links are /user/{key}/list/{id} — real client-side routes with no
    # file behind them, so every unknown path must serve index.html not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin /api in production, which keeps the CORS policy unused there.
    #
    # The upstream host goes through a variable on purpose: that forces nginx to
    # resolve it per request via the resolver configured by docker-resolver.sh,
    # instead of caching the API container's IP forever at startup. $request_uri
    # is required to preserve the path when proxy_pass contains a variable.
    location /api/ {
        set $watchdog_api watchdog-api;
        proxy_pass http://$watchdog_api:8080$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
